name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Test every version the package claims to support. CI used to run only 20
      # while package.json declared >=18 — a floor that was never exercised, on a
      # runtime that reached end-of-life in April 2025. The floor is now 20.
      matrix:
        node-version: [20, 22, 24]
    name: node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
